name: Build a73x-A736BXXSCGZF1

on:
  push:
    branches:
      - feat/a73x-A736BXXSCGZF1
    paths:
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/build-a73x-A736BXXSCGZF1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      kernel_source_url:
        description: 'Override kernel source URL (uses secret A73X_KERNEL_SOURCE_URL if blank)'
        required: false
        default: ''
      kernel_patch_url:
        description: 'Override CGZF1 patch URL (uses secret A73X_KERNEL_PATCH_URL if blank)'
        required: false
        default: ''

env:
  TARGET: a73x-A736BXXSCGZF1
  KERNEL_RELEASE: 5.4.289-qgki-32200428-abA736BXXSCGZF1
  NDK_VERSION: r29

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build the exploit .so payload
  # ──────────────────────────────────────────────
  build-payload:
    name: Build exploit payload (.so)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Build (debug, all targets)
        run: make TARGET=${{ env.TARGET }} all
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build release .so and check size ≤ 104128 bytes
        id: build-release
        run: |
          make TARGET=${{ env.TARGET }} release
          SIZE=$(stat -c %s build/${{ env.TARGET }}/cve-2026-43499-app.release.so)
          echo "release_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Release .so size: $SIZE bytes (limit 104128)"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Report sizes
        run: |
          echo "### Payload sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          for f in build/${{ env.TARGET }}/*; do
            echo "| $(basename $f) | $(stat -c %s $f) bytes |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload payload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a73x-A736BXXSCGZF1-payload
          path: build/${{ env.TARGET }}/
          retention-days: 30

  # ──────────────────────────────────────────────
  # Job 2: Build KernelSU .ko against Samsung 5.4
  # Requires A73X_KERNEL_SOURCE_URL repo variable
  # or kernel_source_url workflow_dispatch input.
  # Set it at:
  #   Settings → Secrets and variables → Actions → Variables
  #   Name: A73X_KERNEL_SOURCE_URL
  #   Value: direct download URL of SM-A736B_16_Opensource.zip from
  #          https://opensource.samsung.com (search "SM-A736B")
  # ──────────────────────────────────────────────
  build-ksu-ko:
    name: Build KernelSU .ko (5.4.289-qgki)
    runs-on: ubuntu-latest
    # Only run when a kernel source URL is provided
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.kernel_source_url != '') ||
      (github.event_name != 'workflow_dispatch' && vars.A73X_KERNEL_SOURCE_URL != '')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            llvm clang lld python3 cpio pahole \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Resolve URLs
        id: resolve-url
        env:
          SECRET_SRC: ${{ secrets.A73X_KERNEL_SOURCE_URL }}
          SECRET_PATCH: ${{ secrets.A73X_KERNEL_PATCH_URL }}
        run: |
          SRC="${{ inputs.kernel_source_url }}"
          [ -z "$SRC" ] && SRC="$SECRET_SRC"
          PATCH="${{ inputs.kernel_patch_url }}"
          [ -z "$PATCH" ] && PATCH="$SECRET_PATCH"
          echo "src_url=$SRC" >> "$GITHUB_OUTPUT"
          echo "patch_url=$PATCH" >> "$GITHUB_OUTPUT"

      - name: Download Samsung kernel base source
        run: |
          mkdir -p /tmp/kernel-src
          echo "Downloading base source..."
          curl -fL --retry 3 --retry-delay 5 \
            "${{ steps.resolve-url.outputs.src_url }}" \
            -o /tmp/kernel.zip
          unzip -q /tmp/kernel.zip -d /tmp/kernel-raw
          TARBALL=$(find /tmp/kernel-raw -name "*.tar.gz" -o -name "*.tar.xz" | head -1)
          if [ -n "$TARBALL" ]; then
            tar -xf "$TARBALL" -C /tmp/kernel-src --strip-components=1
          else
            cp -r /tmp/kernel-raw/. /tmp/kernel-src/
          fi
          echo "Base source extracted: $(ls /tmp/kernel-src | head -5)"

      - name: Apply CGZF1 patch
        run: |
          PATCH_URL="${{ steps.resolve-url.outputs.patch_url }}"
          if [ -z "$PATCH_URL" ]; then
            echo "No patch URL set — skipping patch step"
            exit 0
          fi
          echo "Downloading CGZF1 patch..."
          curl -fL --retry 3 --retry-delay 5 "$PATCH_URL" -o /tmp/patch.zip
          mkdir -p /tmp/patch-raw
          unzip -q /tmp/patch.zip -d /tmp/patch-raw
          # Apply any .patch files found
          find /tmp/patch-raw -name "*.patch" | sort | while read p; do
            echo "Applying patch: $p"
            patch -d /tmp/kernel-src -p1 < "$p"
          done
          # Copy any non-patch files (config overrides, headers, etc.) over the base tree
          find /tmp/patch-raw -not -name "*.patch" -type f | while read f; do
            REL="${f#/tmp/patch-raw/}"
            DEST="/tmp/kernel-src/$REL"
            mkdir -p "$(dirname $DEST)"
            cp "$f" "$DEST"
          done
          echo "CGZF1 patch applied."

      - name: Checkout KernelSU v3.2.5
        run: |
          git clone --depth 1 --branch v3.2.5 \
            https://github.com/tiann/KernelSU.git /tmp/KernelSU

      - name: Apply Samsung KDP/RKP/DEFEX patch
        run: |
          cd /tmp/KernelSU
          git apply "$GITHUB_WORKSPACE/kernelsu/patches/KernelSU-v3.2.5-samsung-kdp-rkp-defex.patch"

      - name: Apply kernel 5.4 source patches
        run: |
          python3 - << 'PYEOF'
          import re, sys

          def patch_file(path, fn):
              try:
                  with open(path) as f:
                      src = f.read()
                  patched = fn(src)
                  if patched != src:
                      with open(path, 'w') as f:
                          f.write(patched)
                      print(f'Patched: {path}')
                  else:
                      print(f'No-op: {path}')
              except FileNotFoundError:
                  print(f'Skip (not found): {path}')

          # pkg_observer.c: Samsung QGKI 5.4 backported the upstream-5.9 fsnotify API
          # (8-param handle_event) but kept the old field name "handle_event".
          # ksu_handle_inode_event has the old 6-param signature, so we need an
          # adapter wrapper that bridges from 8 params -> 6 params for 5.4.
          def patch_pkg_observer(src):
              if 'handle_inode_event' not in src:
                  print('pkg_observer.c: handle_inode_event not present — skip')
                  return src
              if '#include <linux/version.h>' not in src:
                  src = re.sub(r'(#include <linux/[a-z])', r'#include <linux/version.h>\n\1', src, count=1)
              m = re.search(
                  r'(static\s+(?:const\s+)?struct\s+fsnotify_ops\s+(\w+)\s*=\s*\{[^}]*'
                  r'\.handle_inode_event\s*=\s*(\w+)[^}]*\}\s*;)',
                  src, re.DOTALL)
              if not m:
                  print('pkg_observer.c: fsnotify_ops block not found — skip')
                  return src
              old_block = m.group(1)
              struct_name = m.group(2)  # e.g. ksu_ops
              fn_name = m.group(3)      # e.g. ksu_handle_inode_event
              print(f'pkg_observer.c: inserting 8->6 param adapter for fn={fn_name} struct={struct_name}')
              # Samsung QGKI 5.4 handle_event = 8-param (group, inode, mask, data,
              # data_type, file_name, cookie, iter_info).
              # ksu_handle_inode_event = old 6-param (mark, mask, inode, dir, name, cookie).
              # The wrapper adapts the two; mark and dir can be NULL for this use-case.
              new_block = (
                  '#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 9, 0)\n'
                  f'static int {fn_name}_54compat(\n'
                  '    struct fsnotify_group *group, struct inode *inode,\n'
                  '    u32 mask, const void *data, int data_type,\n'
                  '    const struct qstr *file_name, u32 cookie,\n'
                  '    struct fsnotify_iter_info *iter_info)\n'
                  '{\n'
                  f'    return {fn_name}(NULL, mask, inode, NULL, file_name, cookie);\n'
                  '}\n'
                  f'static struct fsnotify_ops {struct_name} = {{\n'
                  f'    .handle_event = {fn_name}_54compat,\n'
                  '};\n'
                  '#else\n'
                  + old_block + '\n'
                  '#endif'
              )
              return src.replace(old_block, new_block, 1)

          # app_profile.c: seccomp.filter_count added in 5.9; skip the reset on 5.4.
          def patch_app_profile(src):
              needle = 'atomic_set(&current->seccomp.filter_count, 0);'
              if needle not in src:
                  print('app_profile.c: filter_count line not found — skip')
                  return src
              if '#include <linux/version.h>' not in src:
                  src = re.sub(r'(#include <linux/[a-z])', r'#include <linux/version.h>\n\1', src, count=1)
              replacement = (
                  '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n'
                  '    ' + needle + '\n'
                  '#endif'
              )
              return src.replace(needle, replacement, 1)

          patch_file('/tmp/KernelSU/kernel/manager/pkg_observer.c', patch_pkg_observer)
          patch_file('/tmp/KernelSU/kernel/policy/app_profile.c', patch_app_profile)
          print('Done.')
          PYEOF

      - name: List available defconfigs (debug)
        run: |
          echo "=== arch/arm64/configs/ ==="
          ls /tmp/kernel-src/arch/arm64/configs/ 2>/dev/null || echo "(directory not found)"
          echo ""
          echo "=== vendor fragment dirs ==="
          ls /tmp/kernel-src/arch/arm64/configs/vendor/ 2>/dev/null || echo "(no vendor dir)"
          echo ""
          echo "=== top-level kernel dirs ==="
          ls /tmp/kernel-src/ | head -20

      - name: Prepare kernel build tree
        run: |
          cd /tmp/kernel-src
          MAKE_FLAGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-"

          # 1. Try exact names (top-level then vendor/ subdir)
          DEFCFG=""
          for candidate in \
            a73xqxx_defconfig a73xq_defconfig a73x_defconfig \
            vendor/a73xqxx_defconfig vendor/a73xq_defconfig \
            vendor/a73xq_eur_open_defconfig vendor/a73xq_eur_defconfig \
            yupik_defconfig vendor/yupik_defconfig \
            gki_defconfig; do
            if [ -f "arch/arm64/configs/$candidate" ]; then
              DEFCFG="$candidate"
              echo "Found defconfig: $candidate"
              break
            fi
          done

          # 2. Glob: top-level then vendor/ subdir
          if [ -z "$DEFCFG" ]; then
            MATCH=$(ls arch/arm64/configs/*a73* arch/arm64/configs/*yupik* \
                       arch/arm64/configs/vendor/*a73* arch/arm64/configs/vendor/*yupik* \
                       2>/dev/null | head -1)
            if [ -n "$MATCH" ]; then
              # pass as relative path from arch/arm64/configs/
              DEFCFG="${MATCH#arch/arm64/configs/}"
              echo "Glob match: $DEFCFG"
            fi
          fi

          if [ -z "$DEFCFG" ]; then
            echo "ERROR: No suitable defconfig found. Available:"
            find arch/arm64/configs -maxdepth 2 | head -40
            exit 1
          fi

          # Run defconfig (pass relative path as make target)
          make $MAKE_FLAGS "$DEFCFG"

          # Enable module support (required for KernelSU .ko)
          echo "CONFIG_MODULES=y"      >> out/.config
          echo "CONFIG_MODULE_UNLOAD=y" >> out/.config

          make $MAKE_FLAGS olddefconfig modules_prepare

      - name: Stamp exact kernel release string
        run: |
          KOUT=/tmp/kernel-src/out
          RELEASE="${{ env.KERNEL_RELEASE }}"
          echo "Stamping release: $RELEASE"
          echo "$RELEASE" > "$KOUT/include/config/kernel.release"
          # utsrelease.h
          sed -i "s/#define UTS_RELEASE \".*\"/#define UTS_RELEASE \"$RELEASE\"/" \
            "$KOUT/include/generated/utsrelease.h" || \
            echo "#define UTS_RELEASE \"$RELEASE\"" > "$KOUT/include/generated/utsrelease.h"
          grep UTS_RELEASE "$KOUT/include/generated/utsrelease.h"

      - name: Generate SELinux headers
        run: |
          KOUT=/tmp/kernel-src/out
          mkdir -p "$KOUT/security/selinux"
          if [ -f "$KOUT/scripts/selinux/genheaders/genheaders" ]; then
            "$KOUT/scripts/selinux/genheaders/genheaders" \
              "$KOUT/security/selinux/flask.h" \
              "$KOUT/security/selinux/av_permissions.h"
          fi

      - name: Create kernel 5.4 compat headers
        run: |
          KOUT=/tmp/kernel-src/out
          mkdir -p "$KOUT/include/linux"

          # linux/pgtable.h was introduced in 5.8; shim it for 5.4
          printf '%s\n' \
            '/* SPDX-License-Identifier: GPL-2.0 */' \
            '#ifndef _LINUX_PGTABLE_COMPAT_H' \
            '#define _LINUX_PGTABLE_COMPAT_H' \
            '#include <asm/pgtable.h>' \
            '#endif' \
            > "$KOUT/include/linux/pgtable.h"

          # Force-include compat header for all KernelSU objects.
          # strncpy_from_user_nofault was renamed from strncpy_from_unsafe_user in 5.8.
          printf '%s\n' \
            '/* KernelSU kernel-5.4 compat (force-included via KCFLAGS) */' \
            '#ifndef _KSU_54_COMPAT_H' \
            '#define _KSU_54_COMPAT_H' \
            '#include <linux/version.h>' \
            '#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)' \
            '#include <linux/uaccess.h>' \
            '#include <linux/sched/task.h>' \
            '/* ---- 5.8 nofault probe API (renamed from probe_kernel_*) ---- */' \
            '#ifndef copy_to_kernel_nofault' \
            'static __always_inline long copy_to_kernel_nofault(void *dst, const void *src, size_t size)' \
            '{ return probe_kernel_write(dst, src, size); }' \
            '#endif' \
            '#ifndef copy_from_kernel_nofault' \
            'static __always_inline long copy_from_kernel_nofault(void *dst, const void *src, size_t size)' \
            '{ return probe_kernel_read(dst, src, size); }' \
            '#endif' \
            '#ifndef strncpy_from_user_nofault' \
            'static __always_inline long strncpy_from_user_nofault(' \
            '    char *dst, const void __user *unsafe_addr, long count)' \
            '{ return strncpy_from_unsafe_user(dst, unsafe_addr, count); }' \
            '#endif' \
            '/* ---- 5.8 faccessat2 syscall (aarch64 #439) ---- */' \
            '#ifndef __NR_faccessat2' \
            '#define __NR_faccessat2 439' \
            '#endif' \
            '/* ---- 5.9 security_inode_init_security_anon (no-op on 5.4) ---- */' \
            '#ifndef security_inode_init_security_anon' \
            '#define security_inode_init_security_anon(i,n,c) ((void)(i),(void)(n),(void)(c),0)' \
            '#endif' \
            '/* ---- 5.10 TWA_RESUME task_work_add mode ---- */' \
            '#ifndef TWA_RESUME' \
            '#define TWA_RESUME 1' \
            '#endif' \
            '/* ---- 5.11 SECCOMP_ARCH_NATIVE_NR (seccomp cache) ---- */' \
            '#ifndef SECCOMP_ARCH_NATIVE_NR' \
            '#include <asm/unistd.h>' \
            '#define SECCOMP_ARCH_NATIVE_NR __NR_syscalls' \
            '#endif' \
            '#endif' \
            '#endif' \
            > /tmp/ksu_compat.h
          echo "Compat headers written."
          cat /tmp/ksu_compat.h

      - name: Build KernelSU module
        run: |
          make -C /tmp/kernel-src/out \
            M="/tmp/KernelSU/kernel" \
            src="/tmp/KernelSU/kernel" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CONFIG_KSU=m \
            CONFIG_KSU_SAMSUNG_KDP=y \
            CONFIG_KSU_SAMSUNG_RKP=y \
            CONFIG_KSU_SAMSUNG_DEFEX=y \
            KBUILD_MODPOST_WARN=1 \
            KCFLAGS="-include /tmp/ksu_compat.h" \
            modules

      - name: Validate .ko
        run: |
          KO=/tmp/KernelSU/kernel/kernelsu.ko
          echo "=== modinfo ==="
          modinfo "$KO" || llvm-readelf -p .modinfo "$KO"
          echo ""
          echo "=== vermagic check ==="
          VERMAGIC=$(modinfo "$KO" 2>/dev/null | grep vermagic || true)
          echo "$VERMAGIC"
          if ! echo "$VERMAGIC" | grep -q "${{ env.KERNEL_RELEASE }}"; then
            echo "WARNING: vermagic does not contain expected release ${{ env.KERNEL_RELEASE }}"
          fi
          echo ""
          echo "=== __versions section size ==="
          llvm-readelf -SW "$KO" | grep __versions || echo "(no __versions section)"
          echo ""
          echo "=== .ko size ==="
          stat -c "Size: %s bytes" "$KO"

      - name: Run symbol audit
        run: |
          # audit_module_against_target.py needs a vmlinux — skip if not available,
          # but run the basic undefined-symbol check that doesn't need one
          KO=/tmp/KernelSU/kernel/kernelsu.ko
          UNDEF=$(llvm-nm -u "$KO" | wc -l)
          echo "Undefined symbols in .ko: $UNDEF"
          echo "### KernelSU .ko audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Undefined symbols: $UNDEF" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(stat -c %s $KO) bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Strip debug sections
        run: |
          llvm-strip -d /tmp/KernelSU/kernel/kernelsu.ko

      - name: Copy .ko to artifacts dir
        run: |
          KO_NAME="android16-5.4_kernelsu-a73x-A736BXXSCGZF1-kdp.ko"
          cp /tmp/KernelSU/kernel/kernelsu.ko \
            "$GITHUB_WORKSPACE/kernelsu/$KO_NAME"
          echo "Saved as kernelsu/$KO_NAME"
          stat -c "Final size: %s bytes" "$GITHUB_WORKSPACE/kernelsu/$KO_NAME"

      - name: Upload .ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: a73x-A736BXXSCGZF1-kernelsu-ko
          path: kernelsu/android16-5.4_kernelsu-a73x-A736BXXSCGZF1-kdp.ko
          retention-days: 30

      - name: Summary
        run: |
          KO="$GITHUB_WORKSPACE/kernelsu/android16-5.4_kernelsu-a73x-A736BXXSCGZF1-kdp.ko"
          echo "### KernelSU .ko build result" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | ${{ env.TARGET }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kernel | ${{ env.KERNEL_RELEASE }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| KernelSU | v3.2.5 + samsung-kdp-rkp-defex patch |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | $(stat -c %s $KO) bytes |" >> "$GITHUB_STEP_SUMMARY"
